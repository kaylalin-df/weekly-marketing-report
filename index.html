<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行銷週報 Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f0;
    --surface: #ffffff;
    --line: #e3e3dd;
    --ink: #0f1311;
    --ink-2: #4f5551;
    --ink-3: #8b918c;
    --blue: #2a78d6;  --blue-soft: #e4eefb;
    --green: #128a4a; --green-soft: #e2f4ea;
    --teal: #0f8f8a;  --teal-soft: #dff3f2;
    --violet: #6a4fd8; --violet-soft: #ebe6fb;
    --amber: #d98a00; --amber-soft: #fff3d9;
    --red: #d03b3b;   --red-soft: #fbe6e6;
    --good: #0ca30c; --warn: #e09a00; --crit: #d03b3b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  a { color: var(--blue); }
  svg { display: inline-block; vertical-align: middle; }

  /* ---------- header ---------- */
  header { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1180px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  .brand .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--teal), var(--blue)); display: grid; place-items: center; color: #fff; }
  .brand small { display: block; font-weight: 400; font-size: 11px; color: var(--ink-3); line-height: 1.2; }
  nav { display: flex; gap: 2px; flex-wrap: wrap; margin-left: auto; }
  nav a { text-decoration: none; color: var(--ink-2); font-size: 13px; padding: 6px 10px; border-radius: 8px; display: inline-flex; align-items: center; gap: 5px; }
  nav a:hover { background: var(--bg); color: var(--ink); }
  .week-select { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }

  /* ---------- hero ---------- */
  .hero {
    max-width: 1180px; margin: 22px auto 0; padding: 0 20px;
  }
  .hero-card {
    position: relative; overflow: hidden; border-radius: 18px; padding: 26px 28px;
    background: linear-gradient(120deg, #0f3d5c 0%, #0f8f8a 60%, #35b28a 100%); color: #fff;
  }
  .hero-card::after {
    content: ""; position: absolute; right: -60px; top: -80px; width: 320px; height: 320px; border-radius: 50%;
    background: rgba(255,255,255,.08);
  }
  .hero-card::before {
    content: ""; position: absolute; right: 120px; bottom: -140px; width: 260px; height: 260px; border-radius: 50%;
    background: rgba(255,255,255,.06);
  }
  .hero-card .eyebrow { font-size: 12px; letter-spacing: .12em; opacity: .8; text-transform: uppercase; }
  .hero-card h1 { margin: 2px 0 4px; font-size: 32px; font-weight: 900; letter-spacing: .01em; }
  .hero-card .range { opacity: .9; }
  .hero-card .updated { position: absolute; right: 24px; top: 22px; font-size: 12px; opacity: .8; }
  .hero-art { position: absolute; right: 36px; bottom: 10px; opacity: .9; }
  @media (max-width: 720px) { .hero-art { display: none; } }
  .hero-nav { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; position: relative; }
  .hero-nav a {
    color: #fff; text-decoration: none; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);
    padding: 8px 12px; border-radius: 10px; font-size: 13px; display: inline-flex; gap: 8px; align-items: center;
  }
  .hero-nav a b { font-weight: 700; }
  .hero-nav a span { opacity: .8; }

  /* ---------- layout ---------- */
  main { max-width: 1180px; margin: 0 auto; padding: 8px 20px 64px; }
  section { margin-top: 40px; }
  .sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .sec-head h2 { margin: 0; font-size: 21px; font-weight: 700; }
  .sec-head .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; }
  .sec-head .hint { color: var(--ink-3); font-size: 13px; }
  .sec-link { font-size: 13px; text-decoration: none; color: var(--blue); background: var(--blue-soft); padding: 4px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
  .sec-link:hover { background: #d3e3f8; }
  .c-blue .ic { background: var(--blue); }  .c-green .ic { background: var(--green); }
  .c-teal .ic { background: var(--teal); }  .c-violet .ic { background: var(--violet); }
  .c-amber .ic { background: var(--amber); }
  .scard .t { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
  .scard .meta { font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
  .scard p { margin: 0 0 6px; font-size: 14px; color: var(--ink-2); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
  .grid { display: grid; gap: 14px; }
  .grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .grid-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  ul.clean { margin: 0; padding-left: 20px; }
  ul.clean li { margin: 6px 0; }
  .empty { color: var(--ink-3); }

  /* ---------- prospect cards ---------- */
  .pcard { display: grid; grid-template-columns: 220px 1fr; gap: 0; overflow: hidden; padding: 0; }
  @media (max-width: 760px) { .pcard { grid-template-columns: 1fr; } }
  .pcard .side { padding: 18px 20px; background: #fafaf8; border-right: 1px solid var(--line); }
  @media (max-width: 760px) { .pcard .side { border-right: 0; border-bottom: 1px solid var(--line); } }
  .pcard .body { padding: 18px 20px; }
  .avatar { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 20px; margin-bottom: 10px; }
  .pcard .name { font-weight: 700; font-size: 17px; }
  .pcard .meta { color: var(--ink-2); font-size: 13px; display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
  .pcard .meta span { display: inline-flex; align-items: center; gap: 6px; }
  .pcard .chip { margin-top: 10px; }
  .pcard .body p { margin: 0 0 6px; }
  ul.sub { margin: 4px 0 8px; padding-left: 20px; font-size: 14px; color: var(--ink-2); }
  ul.sub li { margin: 4px 0; }
  ul.sub li.hl::marker { color: var(--red); }
  ul.sub li.hl span { background: var(--red-soft); color: #a02c2c; font-weight: 600; padding: 1px 6px; border-radius: 6px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .next { margin-top: 10px; padding: 10px 12px; background: var(--blue-soft); border-radius: 10px; font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
  .next b { color: #1c5cab; flex: none; }
  .ask { margin-top: 8px; padding: 10px 12px; background: var(--red-soft); border-radius: 10px; font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
  .ask b { color: #a02c2c; flex: none; }
  .ref { font-size: 13px; margin-top: 6px; }
  .topics { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; margin: 8px 0 4px; }
  .topic { background: #fafaf8; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 10px 14px; position: relative; }
  .topic::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--blue); }
  .topic .th { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .topic .th b { font-size: 14px; }
  .topic .th .no { flex: none; width: 20px; height: 20px; border-radius: 6px; background: var(--blue); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .topic .th .tag { margin-left: auto; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--amber-soft); color: #8a5e00; white-space: nowrap; }
  .topic .th .tag.done { background: var(--green-soft); color: #0a6a0a; }
  .topic .th .tag.wait { background: #ececea; color: var(--ink-2); }
  .topic ul { margin: 0; padding-left: 16px; font-size: 13px; color: var(--ink-2); }
  .topic li { margin: 2px 0; }

  /* ---------- stepper ---------- */
  .stepper { display: flex; align-items: flex-start; margin: 12px 0 4px; }
  .step { flex: 1; text-align: center; position: relative; font-size: 11px; color: var(--ink-3); }
  .step::before { content: ""; position: absolute; top: 7px; left: 50%; right: -50%; height: 2px; background: var(--line); }
  .step:last-child::before { display: none; }
  .step i { position: relative; z-index: 1; display: block; width: 16px; height: 16px; margin: 0 auto 4px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); }
  .step.done::before { background: var(--c); }
  .step.done i { background: var(--c); border-color: var(--c); }
  .step.cur i { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); background: var(--surface); }
  .step.cur { color: var(--ink); font-weight: 700; }
  .step.done { color: var(--ink-2); }
  .stepper.sm .step { font-size: 10px; }
  .stepper.sm .step i { width: 12px; height: 12px; }
  .stepper.sm .step::before { top: 5px; }

  /* ---------- chips ---------- */
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
  .chip-new  { background: var(--blue-soft); color: #1c5cab; }
  .chip-up   { background: var(--green-soft); color: #0a6a0a; }
  .chip-down { background: var(--red-soft); color: #a02c2c; }
  .chip-done { background: #ececea; color: var(--ink-2); }
  .chip-same { color: var(--ink-3); border-color: var(--line); }

  /* ---------- key client cards ---------- */
  .light { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
  .light::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 20%, transparent); }
  .light-green { --c: var(--good); color: #0a6a0a; }
  .light-yellow { --c: var(--warn); color: #8a5e00; }
  .light-red { --c: var(--crit); color: #a02c2c; }
  .kc-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .kc-head .t { font-weight: 700; font-size: 16px; }
  .kc-head .p { color: var(--ink-2); font-size: 14px; }
  .kc-head .light { margin-left: auto; flex: none; }
  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 6px 0 10px; }
  .progress i { display: block; height: 100%; background: var(--blue); border-radius: 4px; }
  .progress.green i { background: var(--good); } .progress.yellow i { background: var(--warn); } .progress.red i { background: var(--crit); }
  .pct { font-size: 13px; color: var(--ink-2); display: flex; justify-content: space-between; }
  .pct b { color: var(--ink); }
  .ms { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .ms span { font-size: 12px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink-3); }
  .ms span.done { background: var(--green-soft); border-color: transparent; color: #0a6a0a; }
  .ms span.done::before { content: "✓ "; }
  .kv { font-size: 14px; margin-top: 6px; }
  .kv b { color: var(--ink-2); font-weight: 500; margin-right: 6px; }
  .kv.risk b { color: #a02c2c; }
  .empty-state { display: flex; align-items: center; gap: 18px; color: var(--ink-2); }
  .empty-state .art { flex: none; width: 72px; height: 72px; border-radius: 20px; background: var(--green-soft); display: grid; place-items: center; color: var(--green); }

  /* ---------- label cards ---------- */
  .lcard { padding: 16px 18px; display: flex; flex-direction: column; }
  .lcard .top { display: flex; align-items: flex-start; gap: 10px; }
  .lcard .icon { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; }
  .lcard .item { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .lcard .meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .lcard .chip { margin-left: auto; flex: none; }
  .lcard .note { font-size: 13.5px; color: var(--ink-2); margin-top: 8px; }
  .lgroup { margin-bottom: 14px; }
  .lgroup-title { font-size: 13px; color: var(--ink-2); font-weight: 700; margin: 0 0 8px 4px; display: flex; align-items: center; gap: 6px; }
  .flow { display: flex; align-items: stretch; gap: 0; margin: 10px 0 6px; flex-wrap: wrap; }
  .flow .node { flex: 1; min-width: 150px; background: var(--teal-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; position: relative; margin-right: 22px; }
  .flow .node:last-child { margin-right: 0; }
  .flow .node::after { content: ""; position: absolute; right: -16px; top: 50%; width: 0; height: 0; border-left: 9px solid var(--teal); border-top: 7px solid transparent; border-bottom: 7px solid transparent; transform: translateY(-50%); }
  .flow .node:last-child::after { display: none; }
  .flow .node b { display: block; color: var(--teal); font-size: 12px; }
  .cond { margin-bottom: 4px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-top: 8px; }
  .cond div { background: #fafaf8; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .cond div span { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--teal); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .notes { margin-top: 14px; }
  .notes ul.clean li { margin: 8px 0; }

  /* ---------- AI cards ---------- */
  .acard { display: grid; grid-template-columns: 96px 1fr; gap: 16px; }
  .ring { width: 96px; height: 96px; position: relative; }
  .ring svg { width: 96px; height: 96px; transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: 20px; color: var(--violet); }
  .acard .t { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .acard .phase { font-size: 12px; color: var(--violet); background: var(--violet-soft); display: inline-block; padding: 2px 8px; border-radius: 999px; margin-bottom: 8px; }
  .ai-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  @media (max-width: 480px) { .ai-lists { grid-template-columns: 1fr; } }
  .ai-lists h4 { margin: 0 0 4px; font-size: 12px; color: var(--ink-3); font-weight: 500; display: flex; align-items: center; gap: 4px; }
  .ai-lists ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .ai-lists li { margin: 3px 0; }
  .blocker { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--amber-soft); font-size: 13px; color: #8a5e00; }

  footer { max-width: 1180px; margin: 0 auto; padding: 0 20px 30px; color: var(--ink-3); font-size: 12px; }
  @media print { header { position: static; } nav, .week-select { display: none; } body { background: #fff; } .card { break-inside: avoid; } }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><span class="logo" id="logoIc"></span><span>行銷週報 Dashboard<small>Marketing Weekly Report</small></span></div>
    <nav id="topnav"></nav>
    <label class="week-select">週次 <select id="weekSelect"></select></label>
  </div>
</header>

<div class="hero" id="hero"></div>
<main id="app"></main>
<footer>資料檔：data/weeks.js ・ 每週一更新</footer>

    cal: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
    link: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
    inbox: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1z"/></svg>',
    hero: '<svg width="150" height="120" viewBox="0 0 150 120" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="70" width="22" height="40" rx="3" fill="rgba(255,255,255,.18)"/><rect x="42" y="50" width="22" height="60" rx="3" fill="rgba(255,255,255,.25)"/><rect x="74" y="30" width="22" height="80" rx="3" fill="rgba(255,255,255,.32)"/><rect x="106" y="12" width="22" height="98" rx="3" fill="rgba(255,255,255,.4)"/><path d="M12 60 C40 48, 60 40, 84 24 S120 6, 138 8"/><circle cx="138" cy="8" r="4" fill="#fff"/></svg>'
  };

  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const chip = c => { const [cls, t] = CHANGE[c] || CHANGE.same; return `<span class="chip ${cls}">${t}</span>`; };
  const li = arr => (arr && arr.length) ? `<ul class="clean">${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<div class="empty">無</div>`;
  const topics = t => (t && t.length) ? `<div class="topics">${t.map((x, i) => `<div class="topic"><div class="th"><span class="no">${i + 1}</span><b>${esc(x.title)}</b>${x.tag ? `<span class="tag ${x.tagType || ""}">${esc(x.tag)}</span>` : ""}</div><ul>${(x.points || []).map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`).join("")}</div>` : "";
  const sub = arr => (arr && arr.length) ? `<ul class="sub">${arr.map(x => (x && x.hl) ? `<li class="hl"><span>${esc(x.text)}</span></li>` : `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  const link = l => l ? `<div class="ref"><a href="${esc(l.url)}" target="_blank" rel="noopener">${I.link} ${esc(l.label || "參考連結")}</a></div>` : "";
  const stepper = (n, list, color, small) => `<div class="stepper ${small ? "sm" : ""}" style="--c:${color}">${list.map((s, i) => `<div class="step ${i + 1 < n ? "done" : i + 1 === n ? "cur" : ""}"><i></i>${s}</div>`).join("")}</div>`;
  const notes = (n, color) => n ? `<div class="card notes"><h3>${I.info} ${esc(n.title || "補充說明")}</h3>${n.items ? li(n.items) : ""}${n.conditions ? cond(n.conditions) : ""}${n.flow ? flow(n.flow) : ""}${(n.links || []).map(link).join("")}</div>` : "";
  const flow = f => `<div class="flow">${f.map(x => `<div class="node"><b>${esc(x.step)}</b>${esc(x.desc || "")}</div>`).join("")}</div>`;
  const cond = c => `<div class="cond">${c.map((x, i) => `<div><span>${i + 1}</span>${esc(x)}</div>`).join("")}</div>`;
  const secHead = (cls, icon, title, hint, id, extra) => `<div class="sec-head ${cls}" id="${id}"><span class="ic">${icon}</span><h2>${title}</h2>${hint ? `<span class="hint">${hint}</span>` : ""}${extra || ""}</div>`;
  const PROSPECT_DASHBOARD = "https://dafon-mk.github.io/weekly-report/";
  const ring = (pct) => { const r = 40, c = 2 * Math.PI * r; return `<div class="ring"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="${r}" stroke="#ebe6fb" stroke-width="10" fill="none"/><circle cx="48" cy="48" r="${r}" stroke="#6a4fd8" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}"/></svg><div class="num">${pct}%</div></div>`; };

  document.getElementById("logoIc").innerHTML = I.logo;
  document.getElementById("topnav").innerHTML = [["#prospects", I.users, "客戶開發"], ["#clients", I.briefcase, "重點客戶"], ["#labels", I.recycle, "循環標誌"], ["#shares", I.info, "資訊分享"], ["#ai", I.cpu, "AI 開發"]]
    .map(([h, ic, t]) => `<a href="${h}">${ic.replace(/width="22" height="22"/, 'width="14" height="14"')} ${t}</a>`).join("");

  function render(w) {
    const hero = document.getElementById("hero"), app = document.getElementById("app");
    if (!w) { app.innerHTML = `<p class="empty">尚無資料</p>`; return; }
    const ps = w.prospects || [], kc = w.keyClients || [], lb = w.labels || [], ai = w.ai || [];

    hero.innerHTML = `<div class="hero-card">
      <div class="eyebrow">Kayla Weekly Marketing Report</div>
      <h1>${esc(w.week)}</h1><div class="range">${esc(w.range)}</div>
      <div class="updated">更新：${esc(w.updated)}</div>
      <div class="hero-art">${I.hero}</div>
      <div class="hero-nav">
        <a href="#prospects">${I.users.replace(/width="22" height="22"/, 'width="16" height="16"')}<b>${ps.length}</b><span>潛在客戶</span></a>
        <a href="#clients">${I.briefcase.replace(/width="22" height="22"/, 'width="16" height="16"')}<b>${kc.length}</b><span>重點專案</span></a>
        <a href="#labels">${I.recycle.replace(/width="22" height="22"/, 'width="16" height="16"')}<b>${lb.length}</b><span>循環標誌申請</span></a>
        <a href="#ai">${I.cpu.replace(/width="22" height="22"/, 'width="16" height="16"')}<b>${ai.length}</b><span>AI 專案</span></a>
      </div></div>`;

    let html = "";

    // ---- 1. prospects ----
    html += `<section>${secHead("c-blue", I.users, "客戶開發進度", "", "prospects", `<a class="sec-link" href="${PROSPECT_DASHBOARD}" target="_blank" rel="noopener">${I.link} 開發 dashboard</a>`)}<div class="grid">`;
    html += ps.map((p, i) => `
      <div class="card pcard">
        <div class="side">
          <div class="avatar" style="background:${AVATAR_COLORS[i % AVATAR_COLORS.length]}">${esc(p.name.slice(0, 1))}</div>
          <div class="name">${esc(p.name)}</div>
          <div class="meta"><span>${I.industry} ${esc(p.industry)}</span>${p.owner ? `<span>${I.user} ${esc(p.owner)}</span>` : ""}</div>
          ${chip(p.change)}
        </div>
        <div class="body">
          ${stepper(p.stage, PROSPECT_STAGES, "var(--blue)")}
          ${p.update ? `<p>${esc(p.update)}</p>` : ""}${sub(p.details)}${topics(p.topics)}${link(p.link)}
          ${p.next ? `<div class="next"><b>${I.arrow} 下一步</b><span>${esc(p.next)}</span></div>` : ""}
          ${p.ask ? `<div class="ask"><b>${I.flag} 待討論</b><span>${esc(p.ask)}</span></div>` : ""}
        </div>
      </div>`).join("") || `<div class="card empty">無</div>`;
    html += `</div>${notes(w.prospectsNotes)}</section>`;

    // ---- 2. key clients ----
    html += `<section>${secHead("c-green", I.briefcase, "既有重點客戶專案報告", `${kc.length} 個專案`, "clients")}<div class="grid grid-3">`;
    html += kc.map(c => `
      <div class="card">
        <div class="kc-head"><div><div class="t">${esc(c.client)}</div><div class="p">${esc(c.project)}</div></div><span class="light light-${c.status}">${STATUS[c.status] || ""}</span></div>
        <div class="pct"><span>整體進度</span><b>${c.progress}%</b></div>
        <div class="progress ${c.status}"><i style="width:${c.progress}%"></i></div>
        <div class="ms">${(c.milestones || []).map(m => `<span class="${m.done ? "done" : ""}">${esc(m.name)}</span>`).join("")}</div>
        <div class="kv"><b>本週</b>${esc(c.update)}</div>
        <div class="kv risk"><b>風險</b>${esc(c.risk || "無")}</div>
      </div>`).join("") || `<div class="card empty-state"><div class="art">${I.inbox}</div><div>${esc(w.keyClientsNote || "本週無特別報告事項")}</div></div>`;
    html += `</div>${notes(w.keyClientsNotes)}</section>`;

    // ---- 3. labels ----
    const groups = [];
    lb.forEach(l => { const g = l.group || ""; let x = groups.find(y => y.name === g); if (!x) { x = { name: g, items: [] }; groups.push(x); } x.items.push(l); });
    html += `<section>${secHead("c-teal", I.recycle, "循環標誌申請進度", `${lb.length} 件申請`, "labels")}`;
    html += notes(w.labelsNotes).replace('class="card notes"', 'class="card notes" style="margin:0 0 18px"');
    html += groups.map(g => `
      <div class="lgroup">${g.name ? `<div class="lgroup-title">${I.tag} ${esc(g.name)}</div>` : ""}
        <div class="grid grid-3">${g.items.map(l => `
          <div class="card lcard">
            <div class="top"><div class="icon">${I.tag}</div><div><div class="item">${esc(l.item)}</div><div class="meta">${I.cal} 預計 ${esc(l.expected)}${l.owner ? ` ・ ${esc(l.owner)}` : ""}</div></div>${chip(l.change)}</div>
            ${stepper(l.stage, LABEL_STAGES, "var(--teal)", true)}
            <div class="note">${esc(l.note)}${sub(l.details)}</div>
          </div>`).join("")}
        </div>
      </div>`).join("") || `<div class="card empty">無</div>`;
    html += `</section>`;

    // ---- 4. shares (optional) ----
    const sh = w.shares || [];
    if (sh.length) {
      html += `<section>${secHead("c-amber", I.info, "資訊分享", `${sh.length} 則`, "shares")}<div class="grid grid-2">`;
      html += sh.map(x => `
        <div class="card scard">
          <div class="t">${esc(x.title)}</div>
          ${x.meta ? `<div class="meta">${esc(x.meta)}</div>` : ""}
          ${x.summary ? `<p>${esc(x.summary)}</p>` : ""}${sub(x.points)}${link(x.link)}
        </div>`).join("");
      html += `</div></section>`;
    }

    // ---- 5. AI ----
    html += `<section>${secHead("c-violet", I.cpu, "AI 開發進度", `${ai.length} 個專案`, "ai")}<div class="grid grid-2">`;
    html += ai.map(a => `
      <div class="card acard">
        ${ring(a.progress)}
        <div>
          <div class="t">${esc(a.name)}</div>
          ${a.phase ? `<span class="phase">${esc(a.phase)}</span>` : ""}
          <div class="ai-lists">
            <div><h4>${I.check} 本週完成</h4>${li(a.done)}</div>
            <div><h4>${I.arrow} 下週計畫</h4>${li(a.next)}</div>
          </div>
          ${(a.blockers || a.need) ? `<div class="blocker">${a.blockers ? `<b>阻礙：</b>${esc(a.blockers)}` : ""}${a.blockers && a.need ? "<br>" : ""}${a.need ? `<b>需要：</b>${esc(a.need)}` : ""}</div>` : ""}
        </div>
      </div>`).join("") || `<div class="card empty-state"><div class="art" style="background:var(--violet-soft);color:var(--violet)">${I.inbox}</div><div>${esc(w.aiNote || "本週無特別報告事項")}</div></div>`;
    html += `</div>${notes(w.aiNotes)}</section>`;

    app.innerHTML = html;
  }

  const sel = document.getElementById("weekSelect");
  DATA.forEach((w, i) => { const o = document.createElement("option"); o.value = i; o.textContent = `${w.week}（${w.range}）`; sel.appendChild(o); });
  const fromHash = DATA.findIndex(w => "#" + w.week === location.hash);
  sel.value = fromHash >= 0 ? fromHash : 0;
  sel.addEventListener("change", () => { render(DATA[sel.value]); history.replaceState(null, "", "#" + DATA[sel.value].week); });
  render(DATA[sel.value]);
})();
</script>
</body>
</html>
